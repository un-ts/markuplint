@if (loggedIn) {
  <input type="text" />
} @else if (pending) {
  <input type="radio" />
} @else {
  <input type="hidden" />
}

@for (item of items; track item.id) {
  <span>{{ item.name }}</span>
} @empty {
  <em>empty</em>
}

@switch (value) {
  @case (1) {
    <b>one</b>
  }
  @default {
    <i>other</i>
  }
}

@let total = items.length;
